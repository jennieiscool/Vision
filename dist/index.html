<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080401">
  <meta name="description" content="A luminous golden interface with orbiting rings and flowing digital circuits.">
  <title>Vision</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="engine.css">
  <link rel="stylesheet" href="vision.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="desktop-ui.css">
  <link rel="stylesheet" href="workspace-files.css?v=20261022-editors-1">
  <link rel="stylesheet" href="workspace-editors.css?v=20261022-native-1">
  <link rel="stylesheet" href="conversations.css?v=20261022-side-chats-1">
  <link rel="stylesheet" href="app-surfaces.css?v=20261022-in-panel-2">
</head>
<body>
  <main aria-label="Animated golden sci-fi interface">
    <canvas id="interface" role="img" aria-label="Concentric glowing gold rings surrounded by circuit traces and binary code"></canvas>
    <div id="reply-caption" aria-label="Vision AI response"><div id="ring-words" aria-hidden="true"></div></div>
    <div class="controls" aria-label="Interface controls">
      <button class="speech-pause" aria-label="Pause spoken reply" title="Pause spoken reply" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button>
      <button id="voice-toggle" class="voice-toggle" aria-label="Unmute Vision voice" aria-pressed="false" title="Unmute voice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3ZM5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8M3 3l18 18"/></svg></button>
      <button id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
    </div>
    <button id="open-chat" class="chat-launch" aria-label="Open chat">Chat</button>
    <div class="voice-feedback"><span id="landing-voice-state" role="status">Voice muted</span><meter id="microphone-level" min="0" max="1" value="0" aria-label="Microphone input level"></meter><select id="microphone-select" aria-label="Microphone" disabled><option value="">Default microphone</option></select></div>
  </main>
  <section id="workspace" class="workspace" aria-label="Chat workspace" hidden>
    <header class="workspace-header"><button id="back" class="back-button" aria-label="Return to ring interface"><span aria-hidden="true">←</span> Vision</button><label class="model-control"><span class="sr-only">Vision model</span><select id="model-select" aria-label="Vision model" disabled><option>Connecting…</option></select></label><span id="voice-state" role="status">Voice muted</span><button id="workspace-voice" class="voice-toggle" aria-label="Unmute Vision voice" aria-pressed="false" title="Unmute voice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3ZM5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8M3 3l18 18"/></svg></button><span class="connection-state">Connecting</span></header>
    <div class="workspace-body">
      <aside class="logs panel" aria-labelledby="logs-title"><header class="panel-header"><h2 id="logs-title">Activity</h2><span class="panel-mark" aria-hidden="true">⌁</span></header><div id="logs-feed" role="log" aria-label="Live Activity"></div></aside>
      <section class="central-grid panel" aria-label="Golden grid workspace"><div id="activity-bar" hidden></div><div id="browser-view" hidden><div id="browser-url"></div><canvas id="browser-image" aria-label="Live Vision browser workspace"></canvas></div><pre id="task-output" hidden></pre><div id="pending-request" hidden></div></section>
      <section class="conversation panel" aria-labelledby="chat-title"><header class="panel-header"><h1 id="chat-title">Chat</h1><span class="panel-mark" aria-hidden="true">◇</span></header><div class="chat-grid"><div class="chat-empty"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 4H4v8m32-8h8v8M4 36v8h8m32-8v8h-8M17 24h14M24 17v14"/></svg><p>No conversation yet</p></div><div id="messages" aria-live="polite"></div></div><form class="composer"><label class="sr-only" for="message">Message</label><textarea id="message" rows="1" placeholder="Message" aria-describedby="chat-connection"></textarea><button type="submit" disabled aria-label="Send message" title="Chat service is not connected"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v15"/></svg></button></form><p id="chat-connection" class="connection-note" hidden></p></section>
    </div>
    <section class="terminals panel" aria-labelledby="terminals-title"><header class="panel-header"><h2 id="terminals-title">Terminal</h2><div class="terminal-actions"><button id="terminal-connect" class="text-button">+ New terminal</button><button id="terminal-close" class="text-button" hidden>Close terminal</button></div></header><div id="terminal-container"></div></section>
  </section>
  <canvas id="transition" aria-hidden="true" hidden></canvas>
  <script src="vendor/marked.js"></script>
  <script src="vendor/purify.js"></script>
  <script src="chat-format.js"></script>
  <script src="interface.js"></script>
  <script src="workspace.js"></script>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="voice.js?v=20261022-side-chats-1"></script>
  <script src="vision.js?v=20261022-normal-layout-2"></script>
  <script src="browser-stream.js"></script>
  <script src="browser-control.js"></script>
  <script src="workspace-files.js?v=20261022-native-1"></script>
  <script src="pdf-viewer.js?v=20261022-editors-1"></script>
  <script src="document-editors.js?v=20261022-editors-1"></script>
  <script src="workspace-projects.js?v=20261022-native-1"></script>
  <script src="app-surfaces.js?v=20261022-in-panel-2"></script>
  <script src="application-library.js?v=20261022-native-1"></script>
  <script src="terminals.js"></script>
  <script src="engine.js?v=20261022-side-chats-1"></script>
  <script src="desktop-ui.js?v=20261022-native-1"></script>
  <script src="settings.js"></script>
  <script src="conversations.js?v=20261022-side-chats-1"></script>
</body>
</html>
